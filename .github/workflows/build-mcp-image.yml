name: Build and publish MCP server image

# Publishes the Tableau-Fabric-AI-Bridge MCP server container to GitHub Container
# Registry (GHCR). Runs entirely on GitHub-hosted runners — no local Docker needed.
# After the first successful run, make the package public once
# (repo > Packages > tableau-fabric-ai-bridge-mcp > Package settings > Change visibility)
# so the "Deploy to Azure" button can pull it without registry credentials.

on:
  push:
    branches: [ main ]
    paths:
      - 'mcp-server/**'
      - '.github/skills/tableau-datasource-profiler/scripts/**'
      - '.github/workflows/build-mcp-image.yml'
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/tableau-fabric-ai-bridge-mcp

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lowercase image name
        id: img
        run: echo "image=${IMAGE,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: mcp-server/Dockerfile
          push: true
          tags: |
            ${{ steps.img.outputs.image }}:latest
            ${{ steps.img.outputs.image }}:${{ github.sha }}
